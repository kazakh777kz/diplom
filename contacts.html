<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — PriceCompare KZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .contact-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 40px;
    }
    
    .contact-info, .contact-form {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 32px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      box-shadow: var(--shadow);
    }
    
    .contact-info h3, .contact-form h3 {
      color: white;
      font-size: 28px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 25px;
      padding: 20px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 16px;
      transition: all 0.3s ease;
      border: 1px solid rgba(99, 102, 241, 0.1);
    }
    
    .info-item:hover {
      background: rgba(51, 65, 85, 0.8);
      transform: translateX(5px);
      border-color: rgba(99, 102, 241, 0.3);
    }
    
    .info-item .icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    
    .info-item strong {
      display: block;
      color: #64748b;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    
    .info-item a, .info-item span {
      color: #e2e8f0;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-weight: 500;
      font-size: 14px;
    }
    
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 16px;
      border: 2px solid rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.8);
      color: white;
      font-family: inherit;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }
    
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--success), #059669);
      color: white;
      border: none;
      padding: 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.4);
    }
    
    .social-links {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }
    
    .social-links a {
      width: 50px;
      height: 50px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.3s ease;
      border: 1px solid rgba(99, 102, 241, 0.2);
      text-decoration: none;
    }
    
    .social-links a:hover {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      transform: translateY(-5px);
    }
    
    @media (max-width: 968px) {
      .contact-section {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
