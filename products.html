<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сравнение цен — PriceCompare KZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ... (стили остаются теми же) ... */
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="logo">PriceCompare KZ</div>
    <div class="nav-section">
      <nav>
        <a href="index.html">Главная</a>
        <a href="products.html">Сравнение</a>
        <a href="contacts.html">Контакты</a>
      </nav>
      <button class="auth-btn" onclick="openAuthModal()">Войти</button>
    </div>
  </div>
</div>

<div class="container">
  <h2>🔍 Поиск по всем магазинам</h2>
  
  <div class="search-section">
    <div class="input-wrapper">
      <input type="text" id="productInput" placeholder="Что ищем? (например: iPhone 15 Pro)" autocomplete="off">
    </div>

    <div class="search-hints">
      <strong>Быстрый поиск:</strong>
      <span class="hint-tag" onclick="setSearch('iPhone 15 Pro')">📱 iPhone</span>
      <span class="hint-tag" onclick="setSearch('Samsung Galaxy S24')">📱 Samsung</span>
      <span class="hint-tag" onclick="setSearch('MacBook Air')">💻 MacBook</span>
      <span class="hint-tag" onclick="setSearch('PlayStation 5')">🎮 PS5</span>
    </div>

    <div class="filters">
      <label><input type="checkbox" class="marketplace" value="kaspi" checked> 🟠 Kaspi</label>
      <label><input type="checkbox" class="marketplace" value="ozon" checked> 🔵 Ozon</label>
      <label><input type="checkbox" class="marketplace" value="wildberries" checked> 🟣 Wildberries</label>
      <label><input type="checkbox" class="marketplace" value="technodom" checked> 🟡 Technodom</label>
    </div>

    <button class="search-btn" onclick="searchRealProducts()" id="searchBtn">
      🔍 Найти лучшие цены
    </button>
  </div>

  <div class="results-container" id="resultsContainer">
    <div id="loadingState" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Собираем цены с магазинов...</p>
    </div>
    
    <table id="resultsTable" style="display: none;">
      <thead>
        <tr>
          <th>Товар</th>
          <th>Магазин</th>
          <th>Цена</th>
          <th>Доставка</th>
          <th>Итого</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
    
    <div id="errorState" style="display: none;"></div>
  </div>
</div>

<div class="footer">
  <p>© 2026 PriceCompare KZ — реальный парсинг цен</p>
</div>

<script>
const API_URL = 'http://localhost:3000/api'; // URL вашего бэкенда

function setSearch(text) {
  document.getElementById('productInput').value = text;
}

function openAuthModal() {
  alert('Модальное окно авторизации');
}

async function searchRealProducts() {
  const query = document.getElementById('productInput').value.trim();
  const btn = document.getElementById('searchBtn');
  const loading = document.getElementById('loadingState');
  const table = document.getElementById('resultsTable');
  const tbody = document.getElementById('results');
  const errorState = document.getElementById('errorState');
  
  if (!query) {
    alert('Введите название товара');
    return;
  }
  
  // Получаем выбранные магазины
  const selectedMarkets = Array.from(
    document.querySelectorAll('.marketplace:checked')
  ).map(el => el.value);
  
  if (selectedMarkets.length === 0) {
    alert('Выберите хотя бы один магазин');
    return;
  }
  
  // UI: начало загрузки
  btn.disabled = true;
  btn.innerHTML = '⏳ Поиск...';
  loading.style.display = 'block';
  table.style.display = 'none';
  errorState.style.display = 'none';
  tbody.innerHTML = '';
  
  try {
    // Параллельный запрос к нескольким парсерам
    const promises = selectedMarkets.map(market => 
      fetch(`${API_URL}/parse/${market}?query=${encodeURIComponent(query)}`)
        .then(r => r.json())
        .then(data => data.products.map(p => ({ ...p, marketplace: market })))
        .catch(() => []) // Если один упал, продолжаем
    );
    
    const resultsArrays = await Promise.all(promises);
    const allProducts = resultsArrays.flat();
    
    // Сортировка по цене
    allProducts.sort((a, b) => {
      const totalA = (a.price || 0) + (a.delivery || 0);
      const totalB = (b.price || 0) + (b.delivery || 0);
      return totalA - totalB;
    });
    
    loading.style.display = 'none';
    
    if (allProducts.length === 0) {
      errorState.innerHTML = `
        <div class="error-message">
          <p>😕 Ничего не найдено</p>
          <p>Попробуйте изменить запрос или выбрать другие магазины</p>
        </div>
      `;
      errorState.style.display = 'block';
      return;
    }
    
    // Рендер результатов
    allProducts.forEach((p, index) => {
      const isBest = index === 0;
      const total = (p.price || 0) + (p.delivery || 0);
      
      const rowStyle = isBest 
        ? 'background: linear-gradient(90deg, rgba(16, 185, 129, 0.15), transparent); border-left: 3px solid #10b981;' 
        : '';
      
      tbody.innerHTML += `
        <tr style="${rowStyle}">
          <td style="padding: 16px; font-weight: 600;">
            ${isBest ? '👑 ' : ''}${p.name}
          </td>
          <td style="padding: 16px; text-transform: uppercase; font-size: 12px; font-weight: 700;">
            <span style="background: ${getMarketColor(p.marketplace)}; color: white; padding: 4px 12px; border-radius: 20px;">
              ${p.marketplace}
            </span>
          </td>
          <td style="padding: 16px; font-weight: 600;">
            ${p.price ? p.price.toLocaleString() + ' ₸' : '—'}
          </td>
          <td style="padding: 16px; color: #94a3b8;">
            ${p.delivery ? p.delivery.toLocaleString() + ' ₸' : 'Бесплатно'}
          </td>
          <td style="padding: 16px; ${isBest ? 'color: #10b981; font-weight: 800; font-size: 18px;' : ''}">
            ${total ? total.toLocaleString() + ' ₸' : '—'}
            ${isBest ? '<span style="background: #10b981; color: white; padding: 4px 10px; border-radius: 12px; font-size: 10px; margin-left: 8px;">ЛУЧШАЯ ЦЕНА</span>' : ''}
          </td>
          <td style="padding: 16px;">
            <a href="${p.link}" target="_blank" class="buy-btn">Перейти →</a>
          </td>
        </tr>
      `;
    });
    
    table.style.display = 'table';
    
  } catch (error) {
    loading.style.display = 'none';
    errorState.innerHTML = `
      <div class="error-message">
        <p>⚠️ Ошибка соединения с сервером</p>
        <p>${error.message}</p>
      </div>
    `;
    errorState.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🔍 Найти лучшие цены';
  }
}

function getMarketColor(market) {
  const colors = {
    kaspi: '#f97316',
    ozon: '#3b82f6',
    wildberries: '#a855f7',
    technodom: '#eab308'
  };
  return colors[market] || '#6366f1';
}

// Поиск по Enter
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('productInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchRealProducts();
  });
});
</script>

</body>
</html>
