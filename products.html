<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сравнение товаров</title>

  <!-- Стили -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<header>
  <h1>Сравнение товаров Казахстан</h1>
  <nav>
    <a href="index.html">Главная</a> |
    <a href="products.html">Сравнение</a> |
    <a href="contacts.html">Контакты</a>
  </nav>
</header>

<main>
  <h2>Поиск товара</h2>

  <input
    type="text"
    id="productInput"
    placeholder="Введите название товара (например: iPhone)"
  >

  <div>
    <label><input type="checkbox" class="marketplace" value="Kaspi" checked> Kaspi</label>
    <label><input type="checkbox" class="marketplace" value="Wildberries" checked> Wildberries</label>
    <label><input type="checkbox" class="marketplace" value="Ozon" checked> Ozon</label>
    <label><input type="checkbox" class="marketplace" value="Technodom" checked> Technodom</label>
    <label><input type="checkbox" class="marketplace" value="Sulpak" checked> Sulpak</label>
  </div>

  <br>
  <button onclick="searchProducts()">Искать</button>

  <table border="1" width="100%" style="margin-top:20px;">
    <thead>
      <tr>
        <th>Товар</th>
        <th>Площадка</th>
        <th>Продавец</th>
        <th>Цена ₸</th>
        <th>Доставка ₸</th>
        <th>Срок</th>
        <th>Итого ₸</th>
        <th>Ссылка</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>
</main>

<!-- JS ВАЖНО: ТОЛЬКО ТАК И ВНИЗУ -->
<script src="js/data.js"></script>
<script src="js/script.js"></script>

</body>
</html>
