<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сравнение товаров</title>

  <!-- СТИЛИ -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">PriceCompare KZ</div>
    <nav>
      <a href="index.html">Главная</a>
      <a href="products.html">Сравнение</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </div>
</div>

<div class="container">

  <div class="search-box">
    <h2>Поиск товара</h2>

    <input
      type="text"
      id="productInput"
      placeholder="Например: iPhone 15 Pro"
    >

    <div class="filters">
      <label><input type="checkbox" class="marketplace" value="Kaspi" checked> Kaspi</label>
      <label><input type="checkbox" class="marketplace" value="Wildberries" checked> Wildberries</label>
      <label><input type="checkbox" class="marketplace" value="Ozon" checked> Ozon</label>
      <label><input type="checkbox" class="marketplace" value="Technodom" checked> Technodom</label>
      <label><input type="checkbox" class="marketplace" value="Sulpak" checked> Sulpak</label>
    </div>

    <button onclick="searchProducts()">Искать</button>
  </div>

  <!-- РЕЗУЛЬТАТЫ -->
  <div id="results" class="cards"></div>

</div>

<div class="footer">
  © 2026 PriceCompare KZ
</div>

<!-- JS (СТРОГО ТУТ И В ТАКОМ ПОРЯДКЕ) -->
<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
