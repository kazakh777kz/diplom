      padding: 0;

    :root {

      --secondary: #ec4899;
      --accent: #06b6d4;

      --light: #f8fafc;
      --gray: #64748b;

    body {

      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
      background-attachment: fixed;
      color: #e2e8f0;
      line-height: 1.6;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
      z-index: -1;
      animation: pulse 15s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    /* HEADER */
    .header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(99, 102, 241, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
    }

    .logo::after {
      content: '⚡';
      position: absolute;
      right: -30px;
      top: -5px;
      font-size: 20px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .nav-section {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    nav a {
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    nav a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      opacity: 0;
      transition: opacity 0.3s;
      z-index: -1;
      border-radius: 12px;
    }

    nav a:hover::before {
      opacity: 1;
    }

    nav a:hover {
      color: white;
      transform: translateY(-2px);
    }

    /* КНОПКА ВОЙТИ В ХЕДЕРЕ */
    .auth-btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    /* CONTAINER */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h2 {
      font-size: 36px;
      font-weight: 800;
      color: white;
      margin-bottom: 40px;
      text-align: center;
      position: relative;
      display: inline-block;
      left: 50%;
      transform: translateX(-50%);
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 2px;
    }

    /* SEARCH SECTION */
    .search-section {
      background: var(--glass);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      margin-bottom: 40px;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 20px 24px;
      font-size: 18px;
      border: 2px solid rgba(99, 102, 241, 0.3);
      border-radius: 16px;
      background: rgba(30, 41, 59, 0.8);
      color: white;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
    }

    .input-wrapper input::placeholder {
      color: #64748b;
    }

    .search-hints {
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search-hints strong {
      color: #94a3b8;
      font-size: 14px;
    }

    .hint-tag {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .hint-tag:hover {
      background: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }

    .filters {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filters label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.8);
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: #e2e8f0;
      font-size: 14px;
    }

    .filters label:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }

    .filters input[type="checkbox"] {

      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .search-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }

    .results-container {
      background: var(--glass);

      border-radius: 24px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      overflow: hidden;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;

    }

      text-align: left;
      color: #94a3b8;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;

      }

      }
    }
  </style>
</head>

  return text.toLowerCase()
    .replace(/ё/g, "е")
    .replace(/[ъь]/g, "")
    .trim();

}

  alert('Модальное окно авторизации будет здесь');
}

function searchProducts() {
  const rawQuery = document.getElementById("productInput").value.trim();
  const query = normalize(rawQuery);
  const tbody = document.getElementById("results");
  tbody.innerHTML = "";

  if (!query) {
    alert("Введите название товара");
    return;
  }

  const selectedMarkets = Array.from(
    document.querySelectorAll(".marketplace:checked")
  ).map(el => el.value);

  const filtered = productsDB.filter(p => {
    const nameEn = normalize(p.name);
    const nameRu = p.nameRu.join(' ');
    return (nameEn.includes(query) || normalize(nameRu).includes(query)) && 
           selectedMarkets.includes(p.marketplace);
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#64748b;">
      <div style="font-size: 48px; margin-bottom: 16px;">🔍</div>
      Ничего не найдено по запросу "${rawQuery}"<br>
      <small style="color: #94a3b8;">Попробуйте: айфон, самсунг, макбук, пс5, робот пылесос</small>
    </td></tr>`;
    return;
  }

  filtered.sort((a, b) => (a.price + a.delivery) - (b.price + b.delivery));

  filtered.forEach((p, index) => {
    const total = p.price + p.delivery;
    const isBestPrice = index === 0;
    
    const rowStyle = isBestPrice ? 'background: linear-gradient(90deg, rgba(16, 185, 129, 0.15), transparent); border-left: 3px solid #10b981;' : '';
    const priceStyle = isBestPrice ? 'color: #10b981; font-weight: 800;' : 'color: #e2e8f0;';

    tbody.innerHTML += `
      <tr style="${rowStyle}">
        <td style="padding: 16px; color: #e2e8f0; border-bottom: 1px solid rgba(99, 102, 241, 0.1); font-weight: 600;">
          ${isBestPrice ? '👑 ' : ''}${p.name}
        </td>
        <td style="padding: 16px; color: #94a3b8; border-bottom: 1px solid rgba(99, 102, 241, 0.1);">${p.marketplace}</td>
        <td style="padding: 16px; color: #94a3b8; border-bottom: 1px solid rgba(99, 102, 241, 0.1);">${p.seller}</td>
        <td style="padding: 16px; color: #e2e8f0; border-bottom: 1px solid rgba(99, 102, 241, 0.1); font-weight: 600;">${p.price.toLocaleString()} ₸</td>
        <td style="padding: 16px; color: #94a3b8; border-bottom: 1px solid rgba(99, 102, 241, 0.1);">${p.delivery === 0 ? 'Бесплатно' : p.delivery.toLocaleString() + ' ₸'}</td>
        <td style="padding: 16px; color: #94a3b8; border-bottom: 1px solid rgba(99, 102, 241, 0.1);">${p.term}</td>
        <td style="padding: 16px; ${priceStyle}; border-bottom: 1px solid rgba(99, 102, 241, 0.1); font-size: 16px;">
          ${total.toLocaleString()} ₸
          ${isBestPrice ? '<span style="background: #10b981; color: white; padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-left: 8px; display: inline-block;">ЛУЧШАЯ ЦЕНА</span>' : ''}
        </td>
        <td style="padding: 16px; border-bottom: 1px solid rgba(99, 102, 241, 0.1);">
          <div class="action-btns">
            <button class="fav-btn" onclick="toggleFavorite('${p.name}', '${p.marketplace}')" title="В избранное">♥</button>
            <a href="${p.url}" target="_blank" class="buy-btn">Купить →</a>
          </div>
        </td>
      </tr>
    `;
  });
}

function toggleFavorite(name, marketplace) {
  alert('Функция избранного требует авторизации');
}

// Поиск по нажатию Enter
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById("productInput");
  if (input) {
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchProducts();
    });
  }
});
</script>
